name: Python quality and offline image checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install headless test environment
        run: |
          python -m pip install --upgrade pip
          pip install numpy 'opencv-python-headless>=4.8,<5' pillow pytest ruff
      - name: Static syntax check
        run: python -m compileall -q kkbsecu main.py scripts tests
      - name: Lint
        run: ruff check kkbsecu scripts tests
      - name: Test suite (no webcam required)
        run: pytest -q
      - name: Offline analysis of supplied test images
        run: python scripts/audit_photos.py --output runtime/photo_audit.json
