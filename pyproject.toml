[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kkbsecu"
version = "3.0.0"
description = "Système de vision par ordinateur pour contrôle d'accès et démonstration hors ligne"
requires-python = ">=3.11"
authors = [{name = "Devmaes"}]
dependencies = ["customtkinter>=5.2,<6", "Pillow>=10,<13", "opencv-python>=4.8,<5", "numpy>=1.26,<3"]

[tool.setuptools.packages.find]
include = ["kkbsecu*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["Ressources", "Pretrainement", "Icones", "Images"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
